# MINIMAL FORK TEST of the !benchmark relay pattern (do not merge upstream).
# Mirrors the real bench-pr.yml job graph and all its GitHub mechanics —
# relay gate + GITHUB_TOKEN self-dispatch, input validation, cache
# save/restore chains (bins / .ixe / compile row), fromJSON matrices,
# hashFiles guard, table artifacts, assemble/comment split — with every
# Lean/Rust step replaced by an echo, on ubuntu-latest only. Proves:
#   1. the issue_comment gate fires and `gh workflow run` starts the
#      dispatched run (GITHUB_TOKEN dispatch — the anti-recursion carve-out);
#   2. inputs arrive and malformed SHAs die in build's first step;
#   3. cache SAVES work in the dispatched run (the low-trust rule breaks
#      them under issue_comment) and fail-on-cache-miss restores succeed
#      downstream;
#   4. re-commenting on the same commit takes every cache-hit path;
#   5. the result comment posts back to the PR from inputs.pr.
name: Benchmark pull requests

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (for the result comment)
        required: true
      base-sha:
        description: Full base SHA to compare against
        required: true
      head-sha:
        description: Full head SHA to benchmark
        required: true
      comment-body:
        description: The !benchmark command line(s)
        required: true

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Benchmark PR #{0}', inputs.pr) || 'Relay benchmark comment' }}"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  dispatch:
    name: Relay !benchmark comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '!benchmark') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: xt0rted/pull-request-comment-branch@v3
        id: comment-branch
      - name: Dispatch the trusted run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          gh workflow run bench-pr.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr="${{ github.event.issue.number }}" \
            -f base-sha="${{ steps.comment-branch.outputs.base_sha }}" \
            -f head-sha="${{ steps.comment-branch.outputs.head_sha }}" \
            -f comment-body="$COMMENT_BODY"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      envs: ${{ steps.parse.outputs.envs }}
      config-summary: ${{ steps.parse.outputs.config-summary }}
    steps:
      - name: Validate SHAs
        env:
          BASE: ${{ inputs.base-sha }}
          HEAD: ${{ inputs.head-sha }}
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "base-sha/head-sha must be full 40-hex SHAs" >&2; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head-sha }}
          persist-credentials: false
      - id: bins
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/bin
          key: bench-bins-${{ inputs.head-sha }}
      # Stand-in for the Lean/Rust build.
      - name: Build fake binary
        if: steps.bins.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          printf '%s\necho "fake ix @ %s"\n' '#!/usr/bin/env bash' \
            "${{ inputs.head-sha }}" > ~/.local/bin/fake-ix
          chmod +x ~/.local/bin/fake-ix
      # THE step under test: fails on issue_comment-triggered runs with
      # "cache write denied: token has no writable scopes".
      - name: Save binaries cache
        if: steps.bins.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/bin
          key: bench-bins-${{ inputs.head-sha }}
      # Stand-in for `ix bench ci parse` (env-delivered comment body, same
      # output names the real parse emits). Mimics the strict grammar:
      # unknown command-line tokens are a hard error; `all` selects both
      # fake cells, the default is ooc only.
      - name: Parse command
        id: parse
        env:
          COMMENT_BODY: ${{ inputs.comment-body }}
        run: |
          echo "parsing: $COMMENT_BODY"
          line=$(printf '%s\n' "$COMMENT_BODY" | grep -m1 '^\s*!benchmark' || true)
          ooc='{"backend":"ooc","env":"InitStd","mode":"execute","label":"ooc-InitStd-execute"}'
          comp='{"backend":"compile","env":"InitStd","mode":"execute","label":"compile-InitStd-execute"}'
          matrix="[$ooc]"
          for tok in $(printf '%s' "$line" | sed 's/^\s*!benchmark//'); do
            case "$tok" in
              all) matrix="[$ooc,$comp]" ;;
              ooc|compile|aiur|zisk|sp1|execute) ;;
              *) echo "error: unknown token '$tok' in benchmark command" >&2; exit 2 ;;
            esac
          done
          {
            echo "matrix=$matrix"
            echo 'envs=["InitStd"]'
            echo "config-summary=fake parse of: $COMMENT_BODY"
          } >> "$GITHUB_OUTPUT"

  compile:
    name: compile-${{ matrix.env }}
    needs: build
    if: needs.build.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.build.outputs.envs) }}
    steps:
      - name: Check for published .ixe
        id: pr-ixe
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.env }}.ixe
          key: bench-pr-ixe-${{ inputs.head-sha }}-${{ matrix.env }}
          lookup-only: true
      - name: Restore PR binaries
        if: steps.pr-ixe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/bin
          key: bench-bins-${{ inputs.head-sha }}
          fail-on-cache-miss: true
      # Stand-in for `ix bench run --backend compile`.
      - name: Compile ${{ matrix.env }}.ixe
        if: steps.pr-ixe.outputs.cache-hit != 'true'
        run: |
          ~/.local/bin/fake-ix > "${{ matrix.env }}.ixe"
          echo '{"CompileInitStd":{"status":"ok","compile-time":1.0}}' > compile.json
      - name: Publish .ixe
        if: steps.pr-ixe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.env }}.ixe
          key: bench-pr-ixe-${{ inputs.head-sha }}-${{ matrix.env }}
      - name: Publish compile row
        if: steps.pr-ixe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: compile.json
          key: bench-pr-row-${{ inputs.head-sha }}-${{ matrix.env }}

  benchmark:
    name: ${{ matrix.cell.label }}
    needs: [build, compile]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.compile.result != 'failure' && needs.compile.result != 'cancelled' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      BACKEND: ${{ matrix.cell.backend }}
      BENV: ${{ matrix.cell.env }}
      HEAD_SHA: ${{ inputs.head-sha }}
    steps:
      - name: Restore PR binaries
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/bin
          key: bench-bins-${{ env.HEAD_SHA }}
          fail-on-cache-miss: true
      - name: Restore PR .ixe
        id: pr-ixe
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.cell.env }}.ixe
          key: bench-pr-ixe-${{ env.HEAD_SHA }}-${{ matrix.cell.env }}
      - name: Restore compile row
        if: matrix.cell.backend == 'compile'
        uses: actions/cache/restore@v5
        with:
          path: compile.json
          key: bench-pr-row-${{ env.HEAD_SHA }}-${{ matrix.cell.env }}
      # Stand-in for the PR-side `ix bench run` (compile cells reuse the
      # compile job's row; others "compile lazily" if the .ixe is absent).
      - name: Run PR side
        continue-on-error: true
        run: |
          if [ "$BACKEND" = compile ] && [ -f compile.json ]; then
            cp compile.json pr.json
            exit 0
          fi
          [ -f "$BENV.ixe" ] || ~/.local/bin/fake-ix > "$BENV.ixe"
          echo "{\"fake\":{\"status\":\"ok\",\"ixe\":\"$(cat "$BENV.ixe")\"}}" > pr.json
      # Racing-publisher fallback with the hashFiles guard, as upstream.
      - name: Save PR .ixe
        if: steps.pr-ixe.outputs.cache-hit != 'true' && hashFiles(format('{0}.ixe', matrix.cell.env)) != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.cell.env }}.ixe
          key: bench-pr-ixe-${{ env.HEAD_SHA }}-${{ matrix.cell.env }}
      - name: Render table
        run: |
          printf '### %s\n\n%s\n' "${{ matrix.cell.label }}" "$(cat pr.json)" \
            > "table-${{ matrix.cell.label }}.md"
      - uses: actions/upload-artifact@v4
        with:
          name: table-${{ matrix.cell.label }}
          path: table-${{ matrix.cell.label }}.md

  assemble:
    needs: [build, benchmark]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download tables
        uses: actions/download-artifact@v4
        with:
          path: tables
          pattern: table-*
          merge-multiple: true
      - name: Build comment body
        env:
          SUMMARY: ${{ needs.build.outputs.config-summary }}
        run: |
          mkdir -p tables
          { echo "## Relay test report"; echo; echo "$SUMMARY"; echo
            cat tables/*.md 2>/dev/null || echo "_no tables_"; } > comment-body.md
      - uses: actions/upload-artifact@v4
        with:
          name: comment-body
          path: comment-body.md

  # Posts the report on success, and a red-X diagnostic when any stage
  # failed — a broken run must never end in silence on the PR.
  comment:
    needs: [build, compile, benchmark, assemble]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # Commenting on a PR via the issues API needs the PR scope too.
      pull-requests: write
    steps:
      - name: Download comment body
        if: needs.assemble.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: comment-body
      - name: Compose failure body
        if: needs.assemble.result != 'success'
        run: |
          {
            echo "## ❌ benchmark run failed"
            echo
            echo "| stage | result |"
            echo "|---|---|"
            echo "| build (incl. command parse) | ${{ needs.build.result }} |"
            echo "| compile | ${{ needs.compile.result }} |"
            echo "| benchmark | ${{ needs.benchmark.result }} |"
            echo "| assemble | ${{ needs.assemble.result }} |"
            echo
            echo "[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md
      # The real workflow posts via an App token; github.token suffices to
      # prove the inputs.pr plumbing on the fork.
      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.pr }}/comments" \
            -F body=@comment-body.md
